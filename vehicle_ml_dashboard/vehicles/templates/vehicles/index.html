<!DOCTYPE html>
<html>
<head>
    <title>Vehicle ML Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .scrollspy-example {
            height: 80vh;
            overflow-y: scroll;
            position: relative;
        }
    </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#dashboard-nav" data-bs-offset="100" tabindex="0">
    <div class="container-fluid mt-4">
        <div class="row">

            <!-- Sidebar Navigation -->
            <div class="col-md-3">
                <div id="dashboard-nav" class="list-group position-sticky top-0">
                    <a class="list-group-item list-group-item-action bg-primary text-white" href="#frequency-table">
                        Frequency Tables (One-way)
                    </a>
                    <a class="list-group-item list-group-item-action bg-primary text-white" href="#high-value-cars">
                        Cars Bought Above 5000
                    </a>
                    <a class="list-group-item list-group-item-action bg-primary text-white" href="#total-price">
    Total Price by Manufacturer
</a>
                </div>
            </div>

            <!-- Scrollable Content -->
            <div class="col-md-9">
                <div class="scrollspy-example" data-bs-spy="scroll" data-bs-target="#dashboard-nav"
                     data-bs-smooth-scroll="true" tabindex="0">

                    <h1 class="text-center text-primary mb-4"> Vehicle Machine Learning Dashboard </h1>

                    <div id="frequency-table" class="card shadow mb-5">
                        <div class="card-header bg-info text-white">
                            Frequency Tables (One-way)
                        </div>
                        <div class="card-body">
                            {{ frequency_table|safe }}
                        </div>
                    </div>

                    <div id="high-value-cars" class="card shadow mb-5">
                        <div class="card-header bg-info text-white">
                            Cars Bought Above 5000
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                {{ high_value_cars|safe }}
                            </div>
                        </div>
                    </div>
                    <div id="total-price" class="card shadow mb-5">
    <div class="card-header bg-info text-white">
        Total Price by Manufacturer
    </div>
    <div class="card-body">
        {{ total_price|safe }}
    </div>
</div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
